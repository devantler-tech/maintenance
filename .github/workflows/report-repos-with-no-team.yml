on:
  schedule:
    - cron: "0 9 * * 3" # Every Wednesday at 09:00 UTC
  workflow_dispatch:

name: Report Repos with No Team

concurrency:
  group: report-repos-with-no-team
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report-repos-with-no-team:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get GitHub App token
        id: get-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: devantler-tech

      - name: Generate report
        id: report
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
        run: |
          bun run report:repos-with-no-team

      - name: Manage report issue
        uses: devantler-tech/actions/upsert-issue@fec61388ed0c4ec4d6d93e3f1a8b8d17e7d40a72 # v9.0.4
        with:
          title: "[report] Repos with No Team Assigned"
          body-file: ${{ steps.report.outputs.report-path }}
          open: ${{ steps.report.outputs.has-violations }}
          close-comment: "✅ All violations have been resolved."
          github-token: ${{ steps.get-token.outputs.token }}
