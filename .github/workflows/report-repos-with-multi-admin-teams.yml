on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 09:00 UTC
  workflow_dispatch:

name: Report Repos with Multi Admin Teams

concurrency:
  group: report-repos-with-multi-admin-teams
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report-repos-with-multi-admin-teams:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get GitHub App token
        id: get-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: devantler-tech

      - name: Generate report
        id: report
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
        run: |
          bun run report:repos-with-multi-admin-teams

      - name: Manage report issue
        uses: devantler-tech/actions/upsert-issue@9ec4a8ec839a330a303371db8797ac44bc1574dd # v13.1.4
        with:
          title: "[report] Repos with Multiple Admin Teams"
          body-file: ${{ steps.report.outputs.report-path }}
          open: ${{ steps.report.outputs.has-violations }}
          close-comment: "✅ All violations have been resolved."
          github-token: ${{ steps.get-token.outputs.token }}
